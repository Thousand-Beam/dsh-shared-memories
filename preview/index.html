<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>共享记忆控制台 · 本地预览</title>
    <!--
      本地预览页（不属于 npm 包，不参与构建）。
      ---------------------------------------------------------------------
      外部依赖只剩 esm.sh：提供浏览器可用的 React ESM 版本，配 importmap 让
      tsc 产出的裸导入 `import 'react'` 能在浏览器里解析。

      ⚠️ 这里**不再**引 Tailwind Play CDN。
      样式全部来自 `src/client/styles.ts` 里那份字符串，由 `installConsoleStyles()`
      在 `createPanel()` 时注入 <style>。真机（宿主页面）走的是同一条路径，
      所以预览看到的样子 = 宿主里的样子，不存在"预览好看、真机裸奔"的偏差。

      预览用 importmap + 逐文件 ESM 而不是打包：tsc 产物本来就是一个 .tsx 一个 .js，
      浏览器原生能加载，看到的是最接近宿主真实加载行为的形态。
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1"
        }
      }
    </script>
    <style>
      html,
      body {
        height: 100%;
      }
      /* 外壳配色只服务"边框与背景"这一层，面板内部所有颜色仍由 dsm-* 令牌决定。
         用 prefers-color-scheme + .dark 双条件，保证手动切主题时外壳跟着变。 */
      body {
        margin: 0;
        background: #eef0f4;
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      html.dark body {
        background: #0a0c11;
      }
      html.dark {
        color-scheme: dark;
      }
      /* 预览外壳：模拟宿主面板的容器尺寸，避免"在 4K 屏上看着像手机"。 */
      #preview-shell {
        height: 100%;
        max-width: 1180px;
        margin: 0 auto;
        padding: 16px;
        box-sizing: border-box;
      }
      #preview-root {
        height: 100%;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(15, 23, 42, 0.1);
        box-shadow:
          0 1px 2px rgba(15, 23, 42, 0.08),
          0 18px 44px -24px rgba(15, 23, 42, 0.35);
      }
      html.dark #preview-root {
        border-color: rgba(255, 255, 255, 0.08);
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.5),
          0 24px 60px -28px rgba(0, 0, 0, 0.9);
      }
    </style>
  </head>
  <body>
    <div id="preview-shell"><div id="preview-root"></div></div>
    <noscript>这个页面需要 JavaScript。</noscript>
    <!-- 编译产物：先跑 npm run preview:build -->
    <script type="module" src="/preview/out/preview/main.js"></script>
  </body>
</html>
